<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КорпМессенджер</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div id="err-banner" class="err-banner hidden"></div>

  <!-- Экран входа -->
  <div id="login-screen" class="login-wrap hidden">
    <div class="login-card">
      <h2>КорпМессенджер</h2>
      <p class="muted">Корпоративный мессенджер</p>
      <label>Адрес сервера <input id="srv-host" placeholder="127.0.0.1"></label>
      <label>Порт <input id="srv-port" type="number" placeholder="5000"></label>
      <label>Логин <input id="login-user" autocomplete="username"></label>
      <label>Пароль <input id="login-pass" type="password" autocomplete="current-password"></label>
      <button id="btn-login" class="primary">Войти</button>
      <button id="btn-register" class="ghost">Регистрация</button>
      <div id="login-msg" class="muted small"></div>
    </div>
  </div>

  <!-- Основной экран -->
  <div id="main-screen" class="hidden main-grid">
    <aside class="sidebar">
      <div class="me-box">
        <div class="avatar" id="me-avatar">?</div>
        <div class="me-info">
          <div id="me-name"></div>
          <select id="my-status" title="Мой статус">
            <option value="online">🟢 В сети</option>
            <option value="away">🟡 Отошёл</option>
            <option value="offline">⚪ Не в сети</option>
          </select>
        </div>
        <button id="logout" title="Выйти">⎋</button>
      </div>
      <nav class="tabs">
        <button data-tab="chats" class="tab active">Чаты</button>
        <button data-tab="directory" class="tab">Контакты</button>
        <button data-tab="groups" class="tab">Группы</button>
        <button data-tab="admin" class="tab admin-only hidden">Админка</button>
      </nav>
      <div id="side-body" class="side-body"></div>
    </aside>
    <section class="chat-area">
      <div id="chat-empty" class="chat-empty"><span>Выберите чат, чтобы начать общение</span></div>
      <div id="chat-view" class="hidden chat-view">
        <header class="chat-head"><div class="ch-main"><span id="chat-title"></span><div id="chat-sub" class="chat-sub"></div></div></header>
        <div id="msgs-box" class="msgs-box"></div>
        <footer class="composer">
          <button id="emoji-btn" title="Смайлы">☺</button>
          <button id="attach-btn" title="Прикрепить файл">📎</button>
          <input type="file" id="file-input" class="hidden">
          <input id="msg-input" placeholder="Сообщение… (: ) можно текстом)" autocomplete="off">
          <button id="send" class="primary">➤</button>
        </footer>
        <div id="emoji-panel" class="emoji-panel hidden"></div>
      </div>
    </section>
  </div>

  <div id="modal-root" class="hidden modal-root"><div id="modal-box" class="modal-box"></div></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
